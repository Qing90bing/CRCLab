target-version = "py310"
line-length = 140
extend-exclude = [
    "导出结果",
]

lint.select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
    "PERF",
]

lint.ignore = [
    "RUF001", "RUF002", "RUF003",  # Chinese text intentionally uses fullwidth punctuation
    "RUF012",  # Config is a static constants holder, not an instance with mutable defaults
]

lint.isort.known-first-party = [
    "config",
    "core",
    "services",
    "tests",
    "view",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
